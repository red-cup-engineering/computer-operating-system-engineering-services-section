name: Windows host observation assay
# Compiles the Windows SDK observation DLL and its ABI consumer, receives one native frame and exercises the
# protocol's refusal paths. Moved here from 561-group/bare-cedar-fog, which tested this section's files from outside.
on:
  push:
    branches: [main]
    paths:
      - 'native/windows-host-pressure/**'
      - 'src/windows-physical-observation.mjs'
      - 'test/windows-physical-observation*.mjs'
      - '.github/workflows/windows-host-observation-assay.yml'
  pull_request:
    paths:
      - 'native/windows-host-pressure/**'
      - 'src/windows-physical-observation.mjs'
      - 'test/windows-physical-observation*.mjs'
      - '.github/workflows/windows-host-observation-assay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-host-observation-assay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-observation:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile the SDK DLL and its finite ABI consumer
        run: |
          cmake -S native/windows-host-pressure -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          cmake --build build --config Release --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "SDK compilation failed" }
      - name: Receive a native Windows frame and exercise refusal paths
        run: |
          & "build/Release/windows_host_pressure_assay.exe" > frame.json
          if ($LASTEXITCODE -ne 0) { throw "Native ABI consumer failed" }
          node test/windows-physical-observation-sdk-assay.mjs frame.json
          if ($LASTEXITCODE -ne 0) { throw "Native frame receiving failed" }
          node --test test/windows-physical-observation.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Protocol refusal assays failed" }
